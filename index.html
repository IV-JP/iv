<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IV-JP | IT Tools & BAT Downloads</title>
<meta name="description" content="IV-JP IT support tools, Windows maintenance and BAT file downloads.">
<style>
*{box-sizing:border-box}
body{
    margin:0;
    font-family:Segoe UI,Arial,sans-serif;
    background:#f4f7fb;
    color:#172033;
}
.header{
    background:linear-gradient(135deg,#0b1736,#173b78);
    color:white;
    padding:42px 20px 48px;
}
.wrap{max-width:1100px;margin:auto}
.badge{
    display:inline-block;
    padding:7px 12px;
    border-radius:20px;
    background:rgba(255,255,255,.13);
    font-size:13px;
    margin-bottom:14px;
}
h1{margin:0 0 10px;font-size:34px}
.subtitle{margin:0;color:#d9e5ff;font-size:16px}
.controls{
    max-width:1100px;
    margin:-25px auto 25px;
    padding:0 20px;
}
.searchbox{
    width:100%;
    padding:16px 18px;
    border:1px solid #d7deea;
    border-radius:12px;
    font-size:15px;
    outline:none;
    box-shadow:0 8px 25px rgba(20,40,80,.08);
}
.searchbox:focus{border-color:#4b75c5}
.status{
    margin:18px 0;
    color:#58657a;
    font-size:14px;
}
.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
    gap:18px;
    padding:0 20px 45px;
}
.card{
    background:white;
    border:1px solid #e0e6ef;
    border-radius:15px;
    padding:22px;
    box-shadow:0 5px 18px rgba(25,45,80,.06);
    display:flex;
    flex-direction:column;
    min-height:190px;
}
.icon{
    width:45px;height:45px;border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    background:#eaf0ff;color:#214d9b;
    font-weight:700;font-size:18px;
    margin-bottom:15px;
}
.filename{
    font-size:16px;
    font-weight:700;
    word-break:break-word;
    margin-bottom:8px;
}
.description{
    color:#667085;
    font-size:13px;
    line-height:1.5;
    flex:1;
}
.actions{margin-top:18px}
.download{
    display:inline-block;
    width:100%;
    text-align:center;
    padding:11px 15px;
    border-radius:9px;
    background:#155eef;
    color:white;
    text-decoration:none;
    font-weight:600;
    font-size:14px;
}
.download:hover{background:#0d4ecb}
.empty{
    grid-column:1/-1;
    text-align:center;
    background:white;
    border-radius:15px;
    padding:35px;
    color:#667085;
}
footer{
    text-align:center;
    padding:25px 20px;
    color:#697586;
    font-size:13px;
}
footer a{color:#155eef;text-decoration:none}
.error{color:#b42318}
</style>
</head>
<body>

<header class="header">
  <div class="wrap">
    <div class="badge">IV-JP • IT SUPPORT TOOLS</div>
    <h1>Windows & IT Tools Download Portal</h1>
    <p class="subtitle">Download approved BAT utilities directly from the IV-JP GitHub repository.</p>
  </div>
</header>

<section class="controls">
  <input id="search" class="searchbox" type="search"
         placeholder="Search BAT files...">
  <div id="status" class="status">Loading files from GitHub...</div>
</section>

<main id="grid" class="grid"></main>

<footer>
  <div>Repository:
    <a href="https://github.com/IV-JP/iv" target="_blank" rel="noopener">
      github.com/IV-JP/iv
    </a>
  </div>
  <div style="margin-top:7px">IV-JP IT Tools Portal</div>
</footer>

<script>
const OWNER = "IV-JP";
const REPO = "iv";
const BRANCH = "main";

const grid = document.getElementById("grid");
const statusBox = document.getElementById("status");
const searchBox = document.getElementById("search");

let batFiles = [];

function rawUrl(name){
    return `https://raw.githubusercontent.com/${OWNER}/${REPO}/${BRANCH}/${encodeURIComponent(name)}`;
}

function githubUrl(name){
    return `https://github.com/${OWNER}/${REPO}/blob/${BRANCH}/${encodeURIComponent(name)}`;
}

function description(name){
    const n = name.toLowerCase();
    if(n.includes("chrome")) return "Google Chrome update, repair, cleanup or performance utility.";
    if(n.includes("audit")) return "IT hardware, Windows and system audit/reporting utility.";
    if(n.includes("cleanup")) return "Windows cleanup and maintenance utility.";
    if(n.includes("system")) return "Windows system maintenance utility.";
    if(n.includes("26up3min")) return "Windows/IT support utility.";
    return "IV-JP Windows and IT support utility.";
}

function render(){
    const q = searchBox.value.trim().toLowerCase();
    const files = batFiles.filter(f => f.name.toLowerCase().includes(q));

    grid.innerHTML = "";

    if(!files.length){
        grid.innerHTML = `<div class="empty">No BAT files found.</div>`;
        return;
    }

    files.forEach(file => {
        const card = document.createElement("article");
        card.className = "card";
        card.innerHTML = `
            <div class="icon">BAT</div>
            <div class="filename">${escapeHtml(file.name)}</div>
            <div class="description">${escapeHtml(description(file.name))}</div>
            <div class="actions">
                <a class="download"
                   href="#"
                   onclick="downloadBat(event, ${JSON.stringify(file.name)})">
                   ↓ Download BAT Directly
                </a>
            </div>
        `;
        grid.appendChild(card);
    });
}

function escapeHtml(value){
    return value.replace(/[&<>"']/g, c => ({
        "&":"&amp;","<":"&lt;",">":"&gt;",
        '"':"&quot;","'":"&#039;"
    }[c]));
}

async function downloadBat(event, fileName){
    event.preventDefault();

    const button = event.currentTarget;
    const originalText = button.textContent;
    button.textContent = "Preparing download...";

    try {
        // Read the BAT file through GitHub's API, then create a local
        // browser download. This avoids opening the BAT as text.
        const apiUrl =
            `https://api.github.com/repos/${OWNER}/${REPO}/contents/${encodeURIComponent(fileName)}?ref=${BRANCH}`;

        const response = await fetch(apiUrl, {
            headers: {
                "Accept": "application/vnd.github+json"
            },
            cache: "no-store"
        });

        if (!response.ok) {
            throw new Error(`GitHub API error: ${response.status}`);
        }

        const data = await response.json();

        if (!data.content) {
            throw new Error("GitHub did not return the file content.");
        }

        // GitHub returns Base64 content. Remove line breaks and decode it.
        const base64 = data.content.replace(/\s/g, "");
        const binary = atob(base64);
        const bytes = new Uint8Array(binary.length);

        for (let i = 0; i < binary.length; i++) {
            bytes[i] = binary.charCodeAt(i);
        }

        const blob = new Blob([bytes], {
            type: "application/octet-stream"
        });

        const blobUrl = URL.createObjectURL(blob);
        const downloadLink = document.createElement("a");

        downloadLink.href = blobUrl;
        downloadLink.download = fileName;
        downloadLink.style.display = "none";

        document.body.appendChild(downloadLink);
        downloadLink.click();
        downloadLink.remove();

        setTimeout(() => URL.revokeObjectURL(blobUrl), 2000);

        button.textContent = "✓ Downloaded";
        setTimeout(() => {
            button.textContent = originalText;
        }, 1500);

    } catch (error) {
        console.error("BAT download error:", error);
        button.textContent = "Download Failed";

        setTimeout(() => {
            button.textContent = originalText;
        }, 2000);

        alert(
            "The BAT file could not be downloaded automatically.\\n\\n" +
            "Please check that the repository is public and the file exists."
        );
    }
}

async function loadFiles(){
    try{
        const response = await fetch(
            `https://api.github.com/repos/${OWNER}/${REPO}/contents/?ref=${BRANCH}`,
            {headers:{"Accept":"application/vnd.github+json"}}
        );

        if(!response.ok) throw new Error(`GitHub returned ${response.status}`);

        const files = await response.json();

        batFiles = files
            .filter(x => x.type === "file" && x.name.toLowerCase().endsWith(".bat"))
            .sort((a,b) => a.name.localeCompare(b.name));

        statusBox.textContent =
            `${batFiles.length} BAT file${batFiles.length === 1 ? "" : "s"} available`;

        render();
    }catch(error){
        statusBox.innerHTML =
            `<span class="error">Unable to load files from GitHub.</span>
             <br>Check that the repository is public and the branch is named "main".`;
        grid.innerHTML = `
          <div class="empty">
            <strong>GitHub files could not be loaded.</strong><br><br>
            You can still open the repository directly:
            <br><br>
            <a href="https://github.com/IV-JP/iv" target="_blank" rel="noopener">
              Open IV-JP/iv on GitHub
            </a>
          </div>`;
        console.error(error);
    }
}

searchBox.addEventListener("input", render);
loadFiles();
</script>
</body>
</html>
